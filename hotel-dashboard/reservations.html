<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Urban Oasis — Reservations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
          colors: {
            teal:   { 50:'#EDF3EE', 100:'#D6E8D8', 200:'#AECFB2', 300:'#84B48A', 400:'#6EA474', 500:'#5C8862', 600:'#4E7854', 700:'#3E6244', 800:'#314E37' },
            sky:    { 50:'#EEF2F6', 100:'#DAE4EE', 200:'#B4CCDE', 300:'#88AFCA', 400:'#6694B2', 500:'#517C9C', 600:'#406888', 700:'#325472' },
            amber:  { 50:'#F5F0E8', 100:'#EAE0C6', 200:'#D2BF90', 300:'#BC9E60', 400:'#A88440', 500:'#9A7030', 600:'#7E5C26', 700:'#664A1E', 800:'#513A18' },
            red:    { 50:'#F4ECEB', 100:'#E9D5D3', 300:'#C09090', 400:'#A87070', 500:'#945858' },
            violet: { 50:'#EEECF4', 100:'#DAD8EC', 500:'#786CA0', 600:'#685C90', 700:'#544C78' },
            cyan:   { 50:'#EAF2F2', 100:'#D0E4E4', 400:'#589090', 600:'#3E7474', 700:'#306060' },
            pink:   { 600:'#926080' },
            indigo: { 600:'#6068A6' },
            purple: { 600:'#6E5EA4' },
            rose:   { 600:'#9E5060' },
            emerald:{ 600:'#4C7852' },
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="shared.css" />
  <style>
    .tbl-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 900px; }
    th {
      background: #F5F2EC; padding: 11px 16px; text-align: left;
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .075em;
      color: #97A09B; border-bottom: 1px solid rgba(20,16,8,.07);
    }
    td { padding: 15px 16px; border-bottom: 1px solid #EAE6DF; font-size: 13px; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #F8F5F0; }
  </style>
  <script>(function(){var c=localStorage.getItem('sb-collapsed')==='true';document.documentElement.style.setProperty('--sw',c?'68px':'240px');})();</script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const RESERVATIONS_DATA = [
      { id:'RES-0841', guest:'David Levi', checkIn:'May 5, 2026', nights:3, room:'204', roomType:'Deluxe', status:'checked-in', total:1260 },
      { id:'RES-0842', guest:'Sarah Cohen', checkIn:'May 5, 2026', nights:2, room:'315', roomType:'Suite', status:'checked-in', total:3200 },
      { id:'RES-0843', guest:'Mark Williams', checkIn:'May 5, 2026', nights:5, room:'108', roomType:'Standard', status:'confirmed', total:2100 }
    ];

    function Icon({ name, size=18, cls="" }) {
      const ref = useRef(null);
      useEffect(() => {
        if (window.lucide && ref.current) {
          ref.current.innerHTML = '';
          const iconNode = lucide.createElement(lucide[name.split('-').map(w => w[0].toUpperCase() + w.slice(1)).join('')]);
          iconNode.setAttribute('width', size);
          iconNode.setAttribute('height', size);
          ref.current.appendChild(iconNode);
        }
      }, [name]);
      return <span ref={ref} className={cls} />;
    }

    const NAV = [
      { label:'Dashboard',    icon:'layout-dashboard', href:'index.html'     },
      { label:'Reservations', icon:'calendar-check',   href:null, active:true },
      { label:'Staff Roster', icon:'users',             href:'roster.html'    },
      { label:'Inventory',    icon:'package',           href:'inventory.html' },
    ];

    function App() {
      const [collapsed, setCollapsed] = useState(() => localStorage.getItem('sb-collapsed') === 'true');
      const [chatOpen, setChatOpen] = useState(false);

      const handleToggle = () => setCollapsed(c => {
        const next = !c;
        localStorage.setItem('sb-collapsed', String(next));
        document.documentElement.style.setProperty('--sw', next ? '68px' : '240px');
        return next;
      });

      return (
        <div className="min-h-screen">
          {/* Sidebar */}
          <aside className={`sidebar sidebar-wrap fixed left-0 top-0 h-screen flex flex-col z-30 ${collapsed ? 'collapsed' : ''}`}>
            {collapsed ? (
              <div className="flex flex-col items-center py-4 border-b border-white/[.05] gap-3">
                <div className="w-8 h-8 rounded-lg bg-teal-600 flex items-center justify-center shrink-0">
                  <Icon name="building-2" size={15} cls="[&_svg]:stroke-white" />
                </div>
                <button onClick={handleToggle} className="w-8 h-8 rounded-lg flex items-center justify-center text-slate-500 hover:text-white hover:bg-white/[.06] transition-colors">
                  <Icon name="chevrons-right" size={16} />
                </button>
              </div>
            ) : (
              <div className="flex items-center gap-3 px-4 py-[18px] border-b border-white/[.05]">
                <div className="w-8 h-8 rounded-lg bg-teal-600 flex items-center justify-center shrink-0">
                  <Icon name="building-2" size={15} cls="[&_svg]:stroke-white" />
                </div>
                <div className="flex-1 min-w-0">
                  <p className="text-white font-semibold text-sm leading-tight tracking-tight">Urban Oasis</p>
                  <p className="text-slate-500 text-[11px]">Hotel Management</p>
                </div>
                <button onClick={handleToggle} className="w-7 h-7 rounded-lg flex items-center justify-center text-slate-600 hover:text-white hover:bg-white/[.06] transition-colors shrink-0">
                  <Icon name="chevrons-left" size={15} />
                </button>
              </div>
            )}
            <nav className="flex-1 px-2.5 py-4 space-y-0.5 overflow-y-auto sb sb-dark">
              {!collapsed && <p className="text-slate-700 text-[9px] font-semibold uppercase tracking-widest px-2.5 mb-3">Main Menu</p>}
              {NAV.map(item => (
                <a key={item.label} href={item.href || '#'}
                  className={`nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-[13px] font-medium
                    ${item.active ? 'nav-active' : 'text-slate-500 hover:text-slate-200'}`}>
                  <Icon name={item.icon} size={16} cls={item.active ? 'text-teal-500' : ''} />
                  <span className="sb-label">{item.label}</span>
                </a>
              ))}
            </nav>
            <div className="px-3 py-3.5 border-t border-white/[.05] flex items-center gap-3">
              <div className="w-8 h-8 rounded-full bg-teal-700 flex items-center justify-center text-white text-xs font-bold shrink-0">GM</div>
              <div className="sb-extra flex-1 min-w-0">
                <p className="text-white text-[12px] font-medium truncate">General Manager</p>
                <p className="text-slate-600 text-[10px] truncate">alonsinger102@gmail.com</p>
              </div>
            </div>
          </aside>

          {/* Main */}
          <div className="main-content flex flex-col min-h-screen">
            <header className="topbar h-14 flex items-center px-6 gap-4 sticky top-0 z-20">
              <p className="text-slate-400 text-xs flex-1">Reservations</p>
              <button onClick={() => setChatOpen(o => !o)}
                className={`flex items-center gap-2 px-3.5 py-2 rounded-xl text-sm font-medium transition-all
                  ${chatOpen ? 'bg-slate-900 text-white' : 'btn-outline text-slate-700'}`}>
                <Icon name="bot" size={15} cls={chatOpen ? '[&_svg]:stroke-white' : 'text-slate-500'} />
                <span>Co-pilot</span>
              </button>
            </header>

            <main className="flex-1 p-7">
              <div className="flex items-center justify-between mb-6 flex-wrap gap-3">
                <div className="flex items-center gap-3.5">
                  <div className="w-10 h-10 rounded-2xl bg-slate-900 flex items-center justify-center shrink-0">
                    <Icon name="calendar-check" size={16} cls="[&_svg]:stroke-white" />
                  </div>
                  <div>
                    <h1 className="text-[17px] font-bold text-slate-800 leading-tight tracking-tight">Reservations</h1>
                    <p className="text-xs text-slate-400 mt-0.5">Real-time guest management</p>
                  </div>
                </div>
                <button className="btn-dark px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2">
                  <Icon name="plus" size={14} cls="[&_svg]:stroke-white" /> New Booking
                </button>
              </div>

              <div className="card">
                <div className="tbl-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th>ID</th><th>Guest</th><th>Dates</th><th>Room</th><th>Status</th><th>Total</th>
                      </tr>
                    </thead>
                    <tbody>
                      {RESERVATIONS_DATA.map(res => (
                        <tr key={res.id}>
                          <td className="font-mono text-[12px] text-slate-400 tracking-tight">{res.id}</td>
                          <td className="font-semibold text-slate-700">{res.guest}</td>
                          <td className="text-slate-500">{res.checkIn} · {res.nights}n</td>
                          <td>
                            <span className="font-medium text-slate-700">{res.room}</span>
                            <span className="ml-2 text-[10px] font-semibold px-2 py-0.5 rounded-full"
                              style={{background:'#F0EDE7',color:'#5A6358'}}>{res.roomType}</span>
                          </td>
                          <td>
                            <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-bold border
                              ${res.status === 'checked-in'
                                ? 'bg-teal-50 text-teal-700 border-teal-200'
                                : 'bg-sky-50 text-sky-700 border-sky-200'}`}>
                              <span className={`w-1.5 h-1.5 rounded-full ${res.status === 'checked-in' ? 'bg-teal-500' : 'bg-sky-400'}`}></span>
                              {res.status}
                            </span>
                          </td>
                          <td className="font-bold text-teal-700">₪{res.total.toLocaleString()}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </main>
          </div>

          {/* Chat panel */}
          <div className={`chat-panel ${chatOpen ? 'open' : ''}`}>
            <div className="px-5 py-4 border-b border-slate-100 flex items-center gap-3 shrink-0">
              <div className="w-9 h-9 rounded-xl bg-slate-900 flex items-center justify-center shrink-0">
                <Icon name="bot" size={17} cls="[&_svg]:stroke-white" />
              </div>
              <div className="flex-1 min-w-0">
                <p className="text-sm font-semibold text-slate-800">Co-pilot</p>
                <div className="flex items-center gap-1.5">
                  <span className="w-1.5 h-1.5 rounded-full bg-teal-500"></span>
                  <span className="text-[10px] text-slate-400 font-medium">Online · AI-powered</span>
                </div>
              </div>
              <button onClick={() => setChatOpen(false)} className="btn-outline w-8 h-8 rounded-lg flex items-center justify-center shrink-0">
                <Icon name="x" size={14} cls="text-slate-400" />
              </button>
            </div>
            <div className="p-5 text-sm text-slate-400 italic">How can I help you manage reservations today?</div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
